# whoami: echoes back the request it receives, including the headers
# Traefik adds. Handy for seeing what a reverse proxy does (lab 05).
# Prerequisite: the traefik stack and the proxy network.
name: whoami

services:
  whoami:
    image: traefik/whoami:v1.11.0
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`whoami.opsforge.localhost`)
      - traefik.http.routers.whoami.entrypoints=websecure
    restart: unless-stopped
    # No ports: Traefik reaches it over the proxy network.

networks:
  proxy:
    external: true
