# Prometheus (lab 11): what to scrape, how often, and where alerts go.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  # Any container with the label prometheus.scrape=true, on the proxy network.
  # Finds every replica (container names change on each deploy, lab 08).
  - job_name: docker
    docker_sd_configs:
      - host: tcp://socket-proxy:2375
        refresh_interval: 15s
        # Default true = only a container's first network. hello-api is on two
        # (its own + proxy); we need one target per network to keep "proxy" below.
        match_first_network: false
        filters:
          - name: label
            values: [prometheus.scrape=true]
    relabel_configs:
      - source_labels: [__meta_docker_network_name]
        regex: proxy
        action: keep
      - source_labels: [__meta_docker_network_ip, __meta_docker_container_label_prometheus_port]
        regex: (.+);(.+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_docker_container_label_prometheus_job]
        target_label: job
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
