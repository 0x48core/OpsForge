# Static configuration: read once at startup. Changes need a restart.
# Routers, services, and middlewares (dynamic config) come from Docker labels
# and from the files in dynamic/, and reload live.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls: {}   # every router on this entry point uses TLS
  metrics:
    address: ":8082"   # Prometheus metrics; not published, scraped over the proxy network

providers:
  docker:
    exposedByDefault: false   # only containers with traefik.enable=true
    network: proxy            # reach containers over the shared proxy network
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: true

log:
  level: INFO

accessLog: {}

# Request rate, errors, and latency per router and service (lab 11).
metrics:
  prometheus:
    entryPoint: metrics
    addRoutersLabels: true
    addServicesLabels: true
