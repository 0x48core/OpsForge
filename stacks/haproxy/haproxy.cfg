# HAProxy config for lab 60.
# Reading order: global → defaults → frontends (what listens) → backends (where it goes).
# Check syntax before every reload:
#   docker compose run --rm haproxy haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg

global
    log stdout format raw local0          # logs go to `docker compose logs haproxy`
    maxconn 4096                          # process-wide connection cap
    # Runtime API: change server state without a reload (step 6).
    stats socket ipv4@0.0.0.0:9999 level admin
    stats timeout 30s
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http                             # layer 7: HAProxy parses HTTP
    log global
    option httplog                        # one detailed line per request
    option dontlognull
    timeout connect 5s                    # HAProxy → server TCP connect
    timeout client  30s                   # client idle
    timeout server  30s                   # server idle (waiting for a response)
    timeout http-request 10s              # whole request headers must arrive in time (slowloris)
    retries 2
    option redispatch                     # on retry, allowed to pick another server
    # Resolve server names through Docker's DNS at runtime, and don't refuse to
    # start if a server can't be resolved yet (it just starts as DOWN/MAINT).
    default-server init-addr last,libc,none resolvers docker

# Docker's embedded DNS server. Re-resolves names, so a recreated container
# (new IP) is picked up without reloading HAProxy.
resolvers docker
    nameserver dns1 127.0.0.11:53
    hold valid 10s

# ---------------------------------------------------------------------------
# Stats page and Prometheus metrics: http://localhost:8404/stats and /metrics
# ---------------------------------------------------------------------------
frontend stats
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s
    stats admin if TRUE                   # lab only: lets the page drain/disable servers

# ---------------------------------------------------------------------------
# Public entry point
# ---------------------------------------------------------------------------
frontend www
    bind :80
    bind :443 ssl crt /usr/local/etc/haproxy/certs/site.pem alpn h2,http/1.1

    # Plain HTTP → HTTPS (301). On a real server (80 → 443) this is just:
    #   http-request redirect scheme https code 301 unless { ssl_fc }
    # Locally the ports are 8080/8443, so swap the port in the Host header too.
    http-request redirect location https://%[req.hdr(host),regsub(:8080,:8443)]%[capture.req.uri] code 301 unless { ssl_fc }

    # Rate limit: track each client IP, refuse with 429 above 20 requests / 10 s.
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 20 }

    # Tell the backend who the client is and which scheme it used.
    option forwardfor                     # adds X-Forwarded-For (HTTP only)
    http-request set-header X-Forwarded-Proto https if { ssl_fc }

    # Routing with ACLs: /api/... goes to the api pool, everything else to web.
    acl is_api path_beg /api
    use_backend api if is_api
    default_backend web

# ---------------------------------------------------------------------------
# Backends
# ---------------------------------------------------------------------------
backend web
    balance roundrobin                    # try: leastconn, source, uri
    option httpchk GET /health
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 # check every 2 s; 3 fails = DOWN, 2 passes = UP
    server web1 web1:80 check
    server web2 web2:80 check
    server web3 web3:80 check

backend api
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    default-server inter 2s fall 3 rise 2
    # Sticky sessions with a cookie: a client keeps hitting the same server.
    cookie SRV insert indirect nocache
    server api1 api1:80 check cookie a1
    server api2 api2:80 check cookie a2

# ---------------------------------------------------------------------------
# Layer 4 (TCP): HAProxy doesn't parse the bytes, it just forwards connections.
# `listen` = a frontend and a backend in one block.
# ---------------------------------------------------------------------------
listen redis
    mode tcp
    bind :6379
    option tcplog
    timeout client 1m
    timeout server 1m
    balance first                         # always the first available server: primary + standby
    option tcp-check                      # speak the Redis protocol in the check
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    server redis1 redis1:6379 check
    server redis2 redis2:6379 check backup  # only used when redis1 is DOWN
