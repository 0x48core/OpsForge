# hello-api + PostgreSQL + Redis (lab 04).
# Usage: cp .env.example .env && docker compose up -d --build
name: hello-api

services:
  app:
    build:
      context: ../../apps/hello-api
      args:
        VERSION: ${APP_VERSION:-dev}
    image: hello-api:${APP_VERSION:-dev}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://cache:6379/0
    ports:
      # Bound to localhost only: Docker-published ports bypass ufw (see lab 01).
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    labels:
      # Scraped by Prometheus via Docker discovery (lab 11): every replica is found.
      prometheus.scrape: "true"
      prometheus.port: "8000"
      prometheus.job: hello-api
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # No ports: only reachable by other services on this Compose network.

  cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  cache-data:
